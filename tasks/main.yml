- name: Check sudo removal safety
  ansible.builtin.import_tasks: check_sudo_removal.yml

- name: Load platform settings
  ansible.builtin.import_tasks: variables.yml

- name: Install doas
  ansible.builtin.package:
    name: "{{ doas_package }}"
    state: present
  when: ansible_distribution != 'OpenBSD'

- name: Configure inventory rules
  ansible.builtin.import_tasks: inventory.yml

- name: Ensure sudo is not installed
  ansible.builtin.package:
    name: "{{ doas_sudo_package }}"
    state: absent
  when: doas_remove_sudo |bool
