all:
  vars:
    ansible_connection: local

  children:
    debian:
      vars:
        test_platform_facts:
          distribution: Debian
          os_family: Debian
        expected_config_file: /etc/doas.conf
        expected_config_group: root
      hosts:
        debian_default:
        debian_host_override:
          doas_config_group: custom_admin
          expected_config_group: custom_admin

    freebsd:
      vars:
        test_platform_facts:
          distribution: FreeBSD
          os_family: FreeBSD
        expected_config_file: /usr/local/etc/doas.conf
        expected_config_group: wheel
      hosts:
        freebsd_default:

    freebsd_group_override:
      vars:
        test_platform_facts:
          distribution: FreeBSD
          os_family: FreeBSD
        doas_config_file: /custom/etc/doas.conf
        expected_config_file: /custom/etc/doas.conf
        expected_config_group: wheel
      hosts:
        freebsd_override:

    openbsd:
      vars:
        test_platform_facts:
          distribution: OpenBSD
          os_family: OpenBSD
        expected_config_file: /etc/doas.conf
        expected_config_group: wheel
      hosts:
        openbsd_default:
